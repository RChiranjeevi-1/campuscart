<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>CampusCart</title>
<style>
:root{--bg:#eef4fb;--cd:#fff;--tx:#0f1f3d;--mu:#5b6b85;--pr:#14306b;--lt:#dbeafe;--bd:#d5deec;--ok:#16a34a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--cd:#141d30;--tx:#e8eefb;--mu:#93a3c0;--pr:#60a5fa;--lt:#1e2f52;--bd:#25324d}}
:root[data-theme="dark"]{--bg:#0b1220;--cd:#141d30;--tx:#e8eefb;--mu:#93a3c0;--pr:#60a5fa;--lt:#1e2f52;--bd:#25324d}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:960px;margin:0 auto;padding:14px}header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{margin:0;font-size:22px;color:var(--pr)}h2{font-size:16px;margin:0 0 6px}.mu{color:var(--mu);font-size:13px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:10px 0;transition:transform .15s}.g>.c:hover{transform:translateY(-2px)}
input,select,textarea,button{font:inherit;color:inherit}input,select,textarea{width:100%;padding:9px;margin:4px 0 8px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
button,a.b{background:var(--pr);color:var(--bg);border:0;border-radius:10px;padding:8px 13px;cursor:pointer;text-decoration:none;display:inline-block;font-size:14px}
:root:not([data-theme="dark"]) button,:root:not([data-theme="dark"]) a.b{color:#fff}
.o{background:transparent!important;color:var(--pr)!important;border:1px solid var(--pr)}.d{background:transparent!important;color:#d92d20!important;border:1px solid #d92d20}
nav{display:flex;gap:6px;overflow-x:auto;margin:10px 0}nav button{background:var(--cd);color:var(--tx)!important;border:1px solid var(--bd);white-space:nowrap}nav button.on{background:var(--pr);color:#fff!important}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px}.g>.c{margin:0}.f{display:flex;gap:8px;flex-wrap:wrap}.f>*{flex:1;min-width:120px}
.t{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--lt);margin-right:4px}.p{font-weight:700;font-size:18px;color:var(--ok)}.r{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.h{display:none}
.em{font-size:42px;text-align:center;background:var(--lt);border-radius:12px;padding:8px}.m{padding:6px 10px;border-radius:12px;margin:4px 0;max-width:80%;background:var(--lt)}.m.me{margin-left:auto;background:var(--pr);color:#fff}
</style></head><body><div class="w">
<header><div><h1>🛒 CampusCart</h1><div class="mu">Your Campus. Your Marketplace.</div></div><div><button class="o" id="th">🌓</button> <span id="who" class="mu"></span></div></header>
<div id="msg" class="mu"></div>
<div id="su" class="c h"><h2>Create your student account</h2><div class="f"><div><input id="sn" placeholder="Full name"><input id="se" type="email" placeholder="Email"></div><div><input id="sc" placeholder="College / University"><input id="si" placeholder="Student ID"></div></div><input id="sp" placeholder="Your UPI ID to receive payments (name@ybl)"><button id="sb">Sign up</button><p class="mu">Your Claude account is your login. Email/ID are not verified in this demo; admin can verify manually.</p></div>
<div id="ap" class="h"><nav id="nv"></nav><div id="vw"></div></div></div>
<script>
(function(){
var db,U,uid,me,own=false,tab='home',L=[],O=[],M=[],R=[],P={},RP=[],cart=[],thread=null,CATS=['Textbooks','Engineering Calculators','Scientific Calculators','Electronics','Stationery','Lab Equipment','Drafting Tools','Other'],CONDS=['New','Like New','Good','Acceptable'],ST=['Order Placed','Payment Confirmed','Seller Processing','Ready for Pickup','Completed','Cancelled'];
var $=function(i){return document.getElementById(i)};
function E(t,p,k){var e=document.createElement(t);for(var a in p||{}){var v=p[a];if(a==='text')e.textContent=v;else if(a==='cls')e.className=v;else if(a.slice(0,2)==='on')e.addEventListener(a.slice(2),v);else e.setAttribute(a,v)}(k||[]).forEach(function(c){if(c)e.appendChild(c)});return e}
function say(t){$('msg').textContent=t||''}function dt(d){var x=typeof d.data==='function'?d.data():d.data;x.id=d.id;return x}
function sub(n,f){db.collection(n).onSnapshot(function(s){f(s.docs.map(dt));draw()},function(){say('Could not load '+n)})}
async function init(){U=await claude.use('user');db=await claude.use('db');if(!U||!db){say('Open this page while signed in to Claude.');return}
uid=await U.id();own=await U.isOwner();
db.collection('profiles').onSnapshot(function(s){P={};s.docs.forEach(function(d){P[d.id]=dt(d)});me=P[uid];$('su').classList.toggle('h',!!me);$('ap').classList.toggle('h',!me);$('who').textContent=me?'👤 '+me.name+(me.verified?' ✔':''):'';draw()});
sub('listings',function(x){L=x});sub('orders',function(x){O=x});sub('messages',function(x){M=x});sub('reviews',function(x){R=x});sub('reports',function(x){RP=x})}
$('th').onclick=function(){var r=document.documentElement;r.setAttribute('data-theme',r.getAttribute('data-theme')==='dark'?'light':'dark')};
$('sb').onclick=async function(){var v=function(i){return $(i).value.trim()};if(v('sn').length<2||!/^\S+@\S+\.\S+$/.test(v('se'))||!v('sc')||!v('si')){say('Fill name, valid email, college and student ID.');return}
try{await db.collection('profiles').doc(uid).set({name:v('sn'),email:v('se'),college:v('sc'),sid:v('si'),upi:v('sp'),wish:[],verified:false,suspended:false,ts:Date.now()});say('Welcome!')}catch(e){say('Sign-up failed — ask the owner to share as Contributor.')}};
function avg(s){var r=R.filter(function(x){return x.seller===s});return r.length?(r.reduce(function(a,b){return a+b.stars},0)/r.length).toFixed(1)+'★ ('+r.length+')':'No ratings'}
function nm(i){return(P[i]||{name:'Student'}).name}
function card(l,mine){var s=P[l.seller]||{},w=(me.wish||[]).indexOf(l.id)>-1,c=E('div',{cls:'c'});
c.appendChild(E('div',{cls:'em',text:{Textbooks:'📚','Engineering Calculators':'🧮','Scientific Calculators':'🧮',Electronics:'🔌',Stationery:'✏️','Lab Equipment':'🧪','Drafting Tools':'📐'}[l.cat]||'🎒'}));
c.appendChild(E('div',{style:'margin-top:8px'},[E('span',{cls:'t',text:l.cat}),E('span',{cls:'t',text:l.cond}),l.sold?E('span',{cls:'t',text:'SOLD'}):null]));
c.appendChild(E('h2',{text:l.title,style:'margin-top:6px'}));c.appendChild(E('div',{cls:'p',text:'₹'+l.price}));
if(l.desc)c.appendChild(E('div',{text:l.desc}));c.appendChild(E('div',{cls:'mu',text:nm(l.seller)+' · '+(s.college||'')+' · '+(l.campus||'')+' · '+avg(l.seller)}));
var r=E('div',{cls:'r'});
if(mine){r.appendChild(E('button',{cls:'o',text:l.sold?'Relist':'Mark sold',onclick:function(){db.collection('listings').doc(l.id).update({sold:!l.sold})}}));r.appendChild(E('button',{cls:'d',text:'Delete',onclick:function(){confirm('Delete?')&&db.collection('listings').doc(l.id).delete()}}))}
else if(!l.sold){r.appendChild(E('button',{text:'Add to cart',onclick:function(){if(!cart.some(function(x){return x.id===l.id}))cart.push(l);say('Added to cart');draw()}}));
r.appendChild(E('button',{cls:'o',text:w?'♥':'♡',onclick:function(){var a=(me.wish||[]).filter(function(x){return x!==l.id});if(!w)a.push(l.id);db.collection('profiles').doc(uid).update({wish:a})}}));
r.appendChild(E('button',{cls:'o',text:'Chat',onclick:function(){thread=l.id+'|'+uid;tab='msg';draw()}}));
r.appendChild(E('button',{cls:'d',text:'Report',onclick:function(){var why=prompt('Why are you reporting this listing?');why&&db.collection('reports').add({listing:l.id,title:l.title,by:uid,why:why,ts:Date.now()}).then(function(){say('Reported. Thanks.')})}}))}
c.appendChild(r);return c}
function browse(v){var f=E('div',{cls:'c f'}),q=E('input',{placeholder:'Search…',id:'q'}),cs=E('select',{id:'fc'},[E('option',{value:'',text:'All categories'})].concat(CATS.map(function(c){return E('option',{text:c})}))),co=E('select',{id:'fo'},[E('option',{value:'',text:'Any condition'})].concat(CONDS.map(function(c){return E('option',{text:c})}))),pm=E('input',{id:'fm',type:'number',placeholder:'Max ₹'}),so=E('select',{id:'fs'},[E('option',{value:'n',text:'Newest'}),E('option',{value:'l',text:'Lowest price'}),E('option',{value:'h',text:'Highest price'})]),cl=E('input',{id:'fl',placeholder:'College'});
[q,cs,co,pm,so,cl].forEach(function(x){x.value=window['_'+x.id]||'';x.oninput=function(){window['_'+x.id]=x.value;var p=document.activeElement.id;draw();var a=$(p);a&&a.focus&&a.focus()};f.appendChild(x)});
v.appendChild(f);var w=function(i){return window['_'+i]||''};
var a=L.filter(function(l){return!l.sold&&P[l.seller]&&!P[l.seller].suspended&&(l.title+l.desc).toLowerCase().indexOf(w('q').toLowerCase())>-1&&(!w('fc')||l.cat===w('fc'))&&(!w('fo')||l.cond===w('fo'))&&(!w('fm')||l.price<=+w('fm'))&&(!w('fl')||(P[l.seller].college||'').toLowerCase().indexOf(w('fl').toLowerCase())>-1)});
var s=w('fs');a.sort(function(x,y){return s==='l'?x.price-y.price:s==='h'?y.price-x.price:y.ts-x.ts});
var g=E('div',{cls:'g'});a.forEach(function(l){g.appendChild(card(l,l.seller===uid))});if(!a.length)g.appendChild(E('p',{cls:'mu',text:'No items found yet — be the first to sell!'}));v.appendChild(g)}
function sell(v){var c=E('div',{cls:'c'}),i={};c.appendChild(E('h2',{text:'Sell an item'}));
function add(k,lab,el){i[k]=el;c.appendChild(E('label',{cls:'mu',text:lab}));c.appendChild(el)}
add('title','Title',E('input',{maxlength:80}));add('cat','Category',E('select',{},CATS.map(function(x){return E('option',{text:x})})));add('cond','Condition',E('select',{},CONDS.map(function(x){return E('option',{text:x})})));add('price','Price (₹)',E('input',{type:'number',min:1}));add('campus','Campus / location',E('input',{}));add('desc','Description',E('textarea',{rows:3,maxlength:400}));
c.appendChild(E('button',{text:'Publish',onclick:async function(){var p=+i.price.value;if(!i.title.value.trim()||!(p>0)){say('Title and price required.');return}
await db.collection('listings').add({title:i.title.value.trim(),cat:i.cat.value,cond:i.cond.value,price:p,campus:i.campus.value.trim(),desc:i.desc.value.trim(),seller:uid,sold:false,ts:Date.now()});say('Published ✅');tab='mine';draw()}}));v.appendChild(c)}
function cartV(v){var t=cart.reduce(function(a,b){return a+b.price},0);v.appendChild(E('h2',{text:'Cart'}));
if(!cart.length)v.appendChild(E('p',{cls:'mu',text:'Your cart is empty.'}));
cart.forEach(function(l){v.appendChild(E('div',{cls:'c'},[E('b',{text:l.title+' — ₹'+l.price}),E('div',{},[E('button',{cls:'d',text:'Remove',onclick:function(){cart=cart.filter(function(x){return x!==l});draw()}})])]))});
if(cart.length){var pm=E('select',{},[E('option',{value:'upi',text:'UPI / PhonePe / GPay (pay seller directly)'}),E('option',{value:'cash',text:'Pay on pickup'})]);
v.appendChild(E('div',{cls:'c'},[E('h2',{text:'Total ₹'+t}),pm,E('button',{text:'Place order',onclick:async function(){for(var l of cart){var code=String(Math.floor(100000+Math.random()*900000));await db.collection('orders').add({listing:l.id,title:l.title,price:l.price,buyer:uid,seller:l.seller,pay:pm.value,status:0,code:code,ts:Date.now()})}cart=[];say('Order placed! Check My Orders.');tab='ord';draw()}})]))}}
function upiLink(o){var s=P[o.seller]||{};return'upi://pay?pa='+encodeURIComponent(s.upi||'')+'&pn='+encodeURIComponent(s.name||'')+'&am='+o.price+'&cu=INR&tn='+encodeURIComponent('CampusCart '+o.id.slice(0,6))}
function orders(v,sellerSide){var a=O.filter(function(o){return o[sellerSide?'seller':'buyer']===uid}).sort(function(x,y){return y.ts-x.ts});
v.appendChild(E('h2',{text:sellerSide?'Incoming orders / sales':'My orders'}));if(!a.length)v.appendChild(E('p',{cls:'mu',text:'Nothing yet.'}));
a.forEach(function(o){var c=E('div',{cls:'c'},[E('b',{text:o.title+' · ₹'+o.price}),E('div',{cls:'mu',text:(sellerSide?'Buyer: '+nm(o.buyer)+' ('+((P[o.buyer]||{}).email||'')+')':'Seller: '+nm(o.seller))+' · '+o.pay.toUpperCase()}),E('div',{cls:'t',text:'Status: '+ST[o.status]})]);
if(!sellerSide){c.appendChild(E('div',{cls:'mu',text:'Pickup code (show to seller): '+o.code}));var r=E('div',{cls:'r'});
if(o.pay==='upi'&&o.status===0&&(P[o.seller]||{}).upi)r.appendChild(E('a',{cls:'b',href:upiLink(o),target:'_top',text:'Pay ₹'+o.price+' via PhonePe/UPI'}));
if(o.status===0)r.appendChild(E('button',{cls:'d',text:'Cancel',onclick:function(){db.collection('orders').doc(o.id).update({status:5})}}));
if(o.status===4&&!R.some(function(x){return x.id===o.id}))r.appendChild(E('button',{text:'Rate seller',onclick:function(){var s=+prompt('Rating 1-5');if(s>=1&&s<=5)db.collection('reviews').doc(o.id).set({seller:o.seller,by:uid,stars:Math.round(s),text:prompt('Review (optional)')||'',ts:Date.now()})}}));c.appendChild(r)}
else if(o.status<4){var n=E('button',{text:'→ '+ST[o.status+1===5?4:o.status+1],onclick:function(){var s=o.status+1;if(s===4&&prompt('Enter buyer pickup code')!==o.code){say('Wrong code');return}db.collection('orders').doc(o.id).update({status:s});s===4&&db.collection('listings').doc(o.listing).update({sold:true})}});c.appendChild(E('div',{cls:'r'},[n,E('button',{cls:'d',text:'Cancel',onclick:function(){db.collection('orders').doc(o.id).update({status:5})}})]))}
v.appendChild(c)})}
function msgs(v){var th={};M.forEach(function(m){(th[m.key]=th[m.key]||[]).push(m)});if(thread&&!th[thread])th[thread]=[];
var keys=Object.keys(th).filter(function(k){return th[k].some(function(m){return m.from===uid||m.to===uid})||k===thread});
v.appendChild(E('h2',{text:'Messages'}));var bar=E('div',{cls:'r'});keys.forEach(function(k){var l=L.find(function(x){return x.id===k.split('|')[0]})||{title:'Item'};bar.appendChild(E('button',{cls:k===thread?'':'o',text:l.title.slice(0,24),onclick:function(){thread=k;draw()}}))});v.appendChild(bar);
if(!thread)return;var l=L.find(function(x){return x.id===thread.split('|')[0]});if(!l)return;var buyer=thread.split('|')[1],other=uid===l.seller?buyer:l.seller;
var box=E('div',{cls:'c'},[E('b',{text:'About: '+l.title+' (₹'+l.price+') · with '+nm(other)})]);(th[thread]||[]).sort(function(a,b){return a.ts-b.ts}).forEach(function(m){box.appendChild(E('div',{cls:'m'+(m.from===uid?' me':''),title:new Date(m.ts).toLocaleString(),text:m.text+'  · '+new Date(m.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}))});
var inp=E('input',{placeholder:'Type a message…'});box.appendChild(inp);box.appendChild(E('button',{text:'Send',onclick:function(){inp.value.trim()&&db.collection('messages').add({key:thread,from:uid,to:other,text:inp.value.trim().slice(0,500),ts:Date.now()})}}));v.appendChild(box)}
function admin(v){v.appendChild(E('div',{cls:'c',text:'Users: '+Object.keys(P).length+' · Listings: '+L.length+' · Orders: '+O.length+' · Sales ₹'+O.filter(function(o){return o.status===4}).reduce(function(a,b){return a+b.price},0)}));
v.appendChild(E('h2',{text:'Reports'}));RP.forEach(function(r){v.appendChild(E('div',{cls:'c'},[E('b',{text:r.title}),E('div',{text:r.why}),E('div',{cls:'r'},[E('button',{cls:'d',text:'Remove listing',onclick:function(){db.collection('listings').doc(r.listing).delete();db.collection('reports').doc(r.id).delete()}}),E('button',{cls:'o',text:'Dismiss',onclick:function(){db.collection('reports').doc(r.id).delete()}})])]))});
v.appendChild(E('h2',{text:'Students'}));Object.keys(P).forEach(function(k){var p=P[k];v.appendChild(E('div',{cls:'c'},[E('b',{text:p.name+' · '+p.college+' · ID '+p.sid}),E('div',{cls:'mu',text:p.email}),E('div',{cls:'r'},[E('button',{cls:'o',text:p.verified?'Unverify':'Verify',onclick:function(){db.collection('profiles').doc(k).update({verified:!p.verified})}}),E('button',{cls:'d',text:p.suspended?'Unsuspend':'Suspend',onclick:function(){db.collection('profiles').doc(k).update({suspended:!p.suspended})}})])]))})}
function draw(){if(!me||!$('vw'))return;var tabs=[['home','Home'],['sell','Sell an Item'],['mine','My Products'],['wish','Wishlist'],['cart','Cart ('+cart.length+')'],['ord','My Orders'],['sales','Sales'],['msg','Messages']];if(own)tabs.push(['adm','Admin']);
var nv=$('nv');nv.textContent='';tabs.forEach(function(t){nv.appendChild(E('button',{cls:t[0]===tab?'on':'',text:t[1],onclick:function(){tab=t[0];draw()}}))});
var v=$('vw');v.textContent='';if(me.suspended){v.appendChild(E('p',{text:'Your account is suspended.'}));return}
if(tab==='home')browse(v);else if(tab==='sell')sell(v);else if(tab==='cart')cartV(v);else if(tab==='ord')orders(v,false);else if(tab==='sales')orders(v,true);else if(tab==='msg')msgs(v);else if(tab==='adm')admin(v);
else{var a=L.filter(function(l){return tab==='mine'?l.seller===uid:(me.wish||[]).indexOf(l.id)>-1});var g=E('div',{cls:'g'});a.forEach(function(l){g.appendChild(card(l,tab==='mine'))});if(!a.length)g.appendChild(E('p',{cls:'mu',text:'Nothing here yet.'}));v.appendChild(g)}}
init()})();
</script></body></html>
